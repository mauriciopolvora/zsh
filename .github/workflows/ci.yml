name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit bash shell turns on pipefail, so a failed command early in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks on the new commits
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # A push that creates the branch has an all-zeros before sha, so scan only the pushed commit.
          if [[ $BASE =~ ^0+$ ]]; then range=(-1 "$HEAD"); else range=("$BASE..$HEAD"); fi
          # WARNING: gitleaks exits 0 on a range git cannot read, so check the range first. -m scans the changes in merge commits.
          git rev-list "${range[@]}" >/dev/null
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="${range[*]} -m" .

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get zsh
        # Unpack only the zsh binary. A dpkg install reads the whole package database and took 7 to 17s here.
        working-directory: ${{ runner.temp }}
        run: |
          get() { apt-get download -qq zsh && dpkg-deb -x zsh_*.deb zsh-root; }
          get || { sudo apt-get update -qq && rm -rf zsh_*.deb zsh-root && get; }
          # The package puts zsh in bin/ or usr/bin/, depending on the release.
          zsh_bin=$(find "$PWD/zsh-root" -path '*bin/zsh' -print -quit)
          "$zsh_bin" --version
          echo "ZSH_BIN=$zsh_bin" >> "$GITHUB_ENV"
      - name: zsh -n on the zsh files, sh -n on install.sh
        run: |
          git ls-files -z -- .zshenv .zshrc .config/zsh/.zshrc '.config/zsh/*.zsh' '.config/zsh/completions/*' | xargs -0 -n1 "$ZSH_BIN" -n
          sh -n install.sh
